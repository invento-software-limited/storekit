<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:16px 0;background:#f9fafb;border:1px solid #e5e7eb;border-radius:6px;">
<tr>
	<td class="stack" style="padding:14px 16px;font-size:13px;color:#6b7280;">Order number<br><strong style="font-size:16px;color:#111827;">#{{ o.order_number }}</strong></td>
	<td class="stack" style="padding:14px 16px;font-size:13px;color:#6b7280;">Order date<br><strong style="font-size:16px;color:#111827;">{{ o.order_date }}</strong></td>
	<td class="stack" style="padding:14px 16px;font-size:13px;color:#6b7280;">Status<br><strong style="font-size:16px;color:{{ o.brand_color or '#1f3a5f' }};">{{ o.order_status }}</strong></td>
</tr>
</table>
